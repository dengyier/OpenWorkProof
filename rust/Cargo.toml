[package]
name = "owp-rust"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
base64 = "0.22"
ed25519-dalek = "2.2"
zeroize = "1"
rmcp = { version = "=1.8.0", features = ["transport-io"] }
tokio = { version = "1", features = ["rt", "time"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
