name: OpenWorkProof GitHub Action fixture smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-contract:
    name: fixture action plumbing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Run fixture contract and adapter tests
        run: >-
          python -m pytest tests/test_github_action_contract.py
          tests/test_github_surface.py -q
