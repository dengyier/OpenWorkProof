[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openworkproof"
version = "1.0.0"
description = "Agent work contracts and verifiable execution protocol"
readme = "README.md"
license = {text = "MIT"}
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security :: Cryptography",
]
keywords = ["agent", "verifiable", "ai", "work-contract", "mcp", "audit", "sign"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography==49.0.0",
  "jsonschema==4.26.0",
  "pydantic==2.13.4",
  "rfc8785==0.1.4",
  "rich==15.0.0",
  "typer==0.27.0",
]

[project.urls]
Homepage = "https://github.com/dengyier/OpenWorkProof"
Repository = "https://github.com/dengyier/OpenWorkProof"
Issues = "https://github.com/dengyier/OpenWorkProof/issues"

[project.optional-dependencies]
dev = [
  "pip-tools==7.5.2",
  "pytest==9.1.1",
  "setuptools==83.0.0",
]
mcp = ["mcp==1.28.1"]

[project.scripts]
owp = "openworkproof.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openworkproof = ["schemas/v0.1/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "docker: requires a running local Docker daemon",
  "agentteams: requires the delivery signoff pinned AgentTeams runtime",
  "supplychain: validates explicit external candidate artifacts and optional required live Docker",
]
