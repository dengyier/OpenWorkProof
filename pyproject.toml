[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openworkproof"
version = "1.2.0"
description = "Agent work contracts and verifiable execution protocol — Ed25519-signed, offline-verifiable proof-carrying work for AI agents."
readme = "README.md"
license = {text = "Apache-2.0"}
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["agent", "verifiable", "ai", "work-contract", "mcp", "audit", "sign", "ed25519", "proof-carrying", "mcp-server"]
requires-python = ">=3.10"
dependencies = [
  "cryptography>=43.0",
  "jsonschema>=4.20",
  "pydantic>=2.5",
  "rfc8785>=0.1.2",
  "rich>=13.0",
  "typer>=0.12",
  "mcp>=1.0",
]

[project.urls]
Homepage = "https://github.com/dengyier/OpenWorkProof"
Repository = "https://github.com/dengyier/OpenWorkProof"
Issues = "https://github.com/dengyier/OpenWorkProof/issues"

[project.optional-dependencies]
dev = [
  "pip-tools>=7.4",
  "pytest>=8.0",
  "setuptools>=68.0",
]

[project.scripts]
owp = "openworkproof.cli:app"
owp-mcp = "openworkproof.mcp_transport:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openworkproof = ["schemas/v0.1/*.json", "schemas/v0.2/*.json", "schemas/v0.3/*.json", "schemas/v0.4/*.json", "schemas/v0.5/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "docker: requires a running local Docker daemon",
  "agentteams: requires the delivery signoff pinned AgentTeams runtime",
  "supplychain: validates explicit external candidate artifacts and optional required live Docker",
]
